name: Dagelijkse forensische analyse

on:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches:
      - 'claude/**'
      - main
  pull_request:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forensic-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installeer dependencies
        run: pip install openpyxl

      - name: Herstel extracted_docs cache
        uses: actions/cache@v4
        with:
          path: extracted_docs/
          key: extracted-docs-${{ github.run_id }}
          restore-keys: extracted-docs-

      - name: Herstel evidence index cache
        uses: actions/cache@v4
        with:
          path: forensic/evidence_index.json
          key: evidence-index-${{ github.run_id }}
          restore-keys: evidence-index-

      - name: Forensische pipeline
        run: python3 -m forensic.pipeline

      - name: Drive sync prompts (niet-kritiek)
        run: python3 -m forensic.drive_sync || true

      - name: Excel rapport
        run: python3 -m forensic.excel_report || true

      - name: Commit manifest en index
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          TODAY=$(date +%Y-%m-%d)
          git add forensic/evidence_index.json forensic/SHA256_MANIFEST.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Geen wijzigingen te committen"
          else
            git commit -m "forensic: dagrapport ${TODAY}"
            git push origin HEAD
          fi
